<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Gematria</title>
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2 class="title">Calculadora Gematria</h2>

    <div class="box-row input-row">
      <input id="word-input" class="input question" type="text" placeholder="Digite ou cole a palavra aqui.">
    </div>

    <div id="keyboard" class="simple-keyboard myTheme1"></div>
    <button id="calculate-button" type="button">Calcular</button>

    <div id="result-box" class="box-resultado" hidden>
      <div id="hebrew-row" class="box-row box-row-reverse"></div>
      <div id="values-row" class="box-row box-row-reverse"></div>
      <div id="result-value" class="resultado"></div>
      <div id="result-root" class="resultado"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
